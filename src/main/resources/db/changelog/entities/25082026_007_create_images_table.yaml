databaseChangeLog:
  - changeSet:
      id: 25082026_007_create_images_table
      author: Subhan
      changes:
        - createTable:
            tableName: images
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp }
              - column: { name: image_url, type: varchar, constraints: { nullable: false } }
              - column: { name: is_main, type: boolean, defaultValueBoolean: false , constraints: { nullable: false } }
              - column: { name: car_id, type: bigint, constraints: { nullable: false } }
