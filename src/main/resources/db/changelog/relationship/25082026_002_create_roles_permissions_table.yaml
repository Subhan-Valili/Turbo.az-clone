databaseChangeLog:
  - changeSet:
      id: 25082026_002_create_roles_permissions_table
      author: Subhan
      changes:
        - createTable:
            tableName: roles_permissions
            columns:
              - column: { name: role_id, type: bigint, constraints: { nullable: false } }
              - column: { name: permission_id, type: bigint, constraints: { nullable: false } }

        - addPrimaryKey:
            tableName: roles_permissions
            columnNames: role_id, permission_id
            constraintName: pk_roles_permissions

        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_roles_permissions_to_roles
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_roles_permissions_to_permissions
            onDelete: CASCADE
